[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-assayer-eval"
version = "0.1.1"
description = "Evaluate and observe LLM-powered applications with deterministic metrics and LLM-as-Judge."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Edson Mota Valença Filho" }]
keywords = ["llm", "evaluation", "llm-as-judge", "agents", "ner", "rag", "langsmith", "langfuse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    "scikit-learn",
]

[project.urls]
Homepage = "https://github.com/emvalencaf/assayer"
Repository = "https://github.com/emvalencaf/assayer"
Issues = "https://github.com/emvalencaf/assayer/issues"
Changelog = "https://github.com/emvalencaf/assayer/blob/master/CHANGELOG.md"

[project.optional-dependencies]
semantic = ["bert-score", "sentence-transformers", "torch", "transformers"]
text = ["nltk", "rouge-score"]
langchain = ["langchain-core"]
langfuse = ["langfuse>=5.0.2"]
langsmith = ["langsmith"]
yaml = ["pyyaml"]
all = ["llm-assayer-eval[semantic,text,langchain,langfuse,langsmith,yaml]"]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
assayer = ["py.typed"]

[tool.setuptools.packages.find]
where = ["."]
include = ["assayer*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# vendored third-party skills are not ours to lint
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
# tests assert on exact messages, compare types and keep fixtures unused on purpose
"tests/**" = ["E501", "E402", "E731", "E711", "E721", "F841", "B905", "RUF003", "RUF013", "RUF043", "N813"]
