name: CI

on:
  pull_request:
    branches: [development, master]

permissions:
  contents: read

jobs:
  pr-target:
    name: PR target
    runs-on: ubuntu-latest
    steps:
      - name: Only development may target master
        if: github.base_ref == 'master' && github.head_ref != 'development'
        run: |
          echo "::error::PRs into master must come from development (see CONTRIBUTING.md)"
          exit 1

  checks:
    name: Unicode, ruff, wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Unicode
        run: git ls-files -z | xargs -0 uv run scripts/check_unicode.py
      - name: Ruff lint
        run: uvx ruff check .
      - name: Ruff format
        run: uvx ruff format --check .
      - name: Wiki bundle
        run: |
          if [ -d .wiki ]; then
            uv run .agents/skills/validate/scripts/okf_validate.py .wiki --strict
          fi

  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # a PR that only touches docs and the wiki skips the (slow) test job
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.wiki/**'

  core:
    name: Tests (core only)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Public modules import with no extra
        run: >
          uv run --no-dev python -c
          "import assayer, assayer.metrics, assayer.judges, assayer.adapters"
      - name: Pytest (packaging)
        run: uv run --group dev pytest tests/test_packaging.py

  tests:
    name: Tests (all extras)
    needs: changes
    # a skipped job counts as passed for required status checks
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-v1
      - name: Pytest
        run: uv run --extra all --group dev pytest

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit format
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -n1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::commit $sha does not follow CONTRIBUTING.md"
              status=1
            fi
          done
          exit $status
